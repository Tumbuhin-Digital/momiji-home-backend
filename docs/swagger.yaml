    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_cart.CartResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get Cart
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      parameters:
