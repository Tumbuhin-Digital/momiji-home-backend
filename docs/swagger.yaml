      - Order
  /orders/{id}/accept:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Accept Order Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_order.AcceptOrderRequest'
      produces:
      - application/json
      responses:
        "200":
