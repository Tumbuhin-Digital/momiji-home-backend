basePath: /api/v1
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.TokenResponse:
    properties:
      expires_in:
        description: seconds
        type: integer
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
      shopify_customer_id:
        type: string
    type: object
  cart.CartItem:
    properties:
      balance_due:
        type: string
      deposit_amount:
        type: string
      height:
        type: number
      id:
        type: string
      image_src:
        type: string
      inventory_quantity:
        type: integer
      length:
        type: number
      quantity:
        type: integer
      subtotal:
        type: string
      title:
        type: string
      unit_price:
        type: string
      variant_id:
        type: string
      weight:
        type: number
      weight_unit:
        type: string
      width:
        type: number
    type: object
  cart.CartItemRequest:
    properties:
      quantity:
        minimum: 1
        type: integer
      variant_id:
        type: string
    required:
    - quantity
    - variant_id
    type: object
  cart.CartResponse:
    properties:
      pre_order:
        items:
          $ref: '#/definitions/cart.CartItem'
        type: array
      session_id:
        type: string
      ship_ready:
        items:
          $ref: '#/definitions/cart.CartItem'
        type: array
      summary:
        $ref: '#/definitions/cart.CartSummaryDTO'
    type: object
  cart.CartSummaryDTO:
    properties:
      currency:
        type: string
      total_balance_due:
        type: string
      total_charged_now:
        type: string
      total_deposit:
        type: string
      total_pre_order:
        type: string
      total_ship_ready:
        type: string
    type: object
  cart.GuestSessionResponse:
    properties:
      expires_at:
        type: string
      session_id:
        type: string
    type: object
  cart.MergeCartRequest:
    properties:
      guest_session_id:
        type: string
    required:
    - guest_session_id
    type: object
  cart.SetVariantQuantityRequest:
    properties:
      total_quantity:
        minimum: 0
        type: integer
      variant_id:
        type: string
    required:
    - variant_id
    type: object
  cart.UpdateCartItemRequest:
    properties:
      quantity:
        minimum: 0
        type: integer
    type: object
  checkout.CheckoutSummaryRequest:
    properties:
      address_id:
        type: integer
      shipping_method:
        type: string
    type: object
  checkout.CheckoutSummaryResponse:
    properties:
      currency:
        type: string
      due_august:
        properties:
          preorder_balance:
            type: string
          shipping_preorder:
            type: string
          total:
            type: string
        type: object
      due_now:
        properties:
          preorder_deposit:
            type: string
          ship_ready_total:
            type: string
          shipping:
            type: string
          total:
            type: string
        type: object
      pre_order:
        properties:
          balance_subtotal:
            type: string
          deposit_subtotal:
            type: string
          items:
            items:
              $ref: '#/definitions/cart.CartItem'
            type: array
        type: object
      ship_ready:
        properties:
          items:
            items:
              $ref: '#/definitions/cart.CartItem'
            type: array
          subtotal:
            type: string
        type: object
      shipping:
        properties:
          cost:
            type: string
          estimated_arrival:
            type: string
          method:
            type: string
        type: object
    type: object
  checkout.InitiateCheckoutRequest:
    properties:
      address_id:
        type: integer
      address1:
        type: string
      city:
        type: string
      country:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
      shipping_method:
        type: string
      state:
        type: string
      zip:
        type: string
    type: object
  checkout.InitiateCheckoutResponse:
    properties:
      checkout_reference:
        type: string
      checkout_url:
        type: string
    type: object
  checkout.ShippingRateDTO:
    properties:
