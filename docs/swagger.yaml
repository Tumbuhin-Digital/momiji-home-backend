      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      orders_count:
        type: integer
      phone:
        type: string
    type: object
  dashboard.DashboardSummaryResponse:
    properties:
      recent_orders:
        items:
          $ref: '#/definitions/dashboard.RecentOrder'
        type: array
      sales_report:
        $ref: '#/definitions/dashboard.SalesReport'
