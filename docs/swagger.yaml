  order.OrderResponse:
    properties:
      aggregate_status:
        description: deprecated
        type: string
      currency:
        type: string
      customer:
        $ref: '#/definitions/order.CustomerDTO'
      financial_status:
        type: string
      fulfillment_status:
        type: string
      id:
        type: string
      line_items:
        $ref: '#/definitions/order.LineItemsGroup'
      order_date:
