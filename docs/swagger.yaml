      address2:
        type: string
      city:
        type: string
      country:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      last_name:
        type: string
      phone:
        type: string
      province:
        type: string
      zip:
        type: string
    type: object
  customer.CustomerDetailResponse:
    properties:
      addresses:
        items:
          $ref: '#/definitions/customer.AddressResponse'
        type: array
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      orders_count:
        type: integer
      phone:
        type: string
    type: object
  customer.CustomerOrderResponse:
