basePath: /api/v1
definitions:
  github_com_tumbuhindigi-sys_momiji-home-backend_internal_cart.CartItem:
    properties:
      balance_due:
        type: string
      deposit_amount:
        type: string
      id:
        type: string
      image_src:
        type: string
      quantity:
        type: integer
      subtotal:
        type: string
      title:
        type: string
      unit_price:
        type: string
      variant_id:
        type: string
    type: object
  github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
      message:
        type: string
      status:
        description: '"success" or "error"'
        type: string
      timestamp:
        type: string
    type: object
  github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock:
    properties:
      code:
        type: string
      details: {}
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: seconds
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    type: object
  internal_auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
      shopify_customer_id:
        type: string
    type: object
  internal_cart.CartItem:
    properties:
      balance_due:
        type: string
      deposit_amount:
        type: string
      id:
        type: string
      image_src:
        type: string
      quantity:
        type: integer
      subtotal:
        type: string
      title:
        type: string
      unit_price:
        type: string
      variant_id:
        type: string
    type: object
  internal_cart.CartItemRequest:
    properties:
      fulfillment_type:
        enum:
        - ship_ready
        - pre_order
        type: string
      quantity:
        minimum: 1
        type: integer
      variant_id:
        type: string
    required:
    - fulfillment_type
    - quantity
    - variant_id
    type: object
  internal_cart.CartResponse:
    properties:
      pre_order:
        items:
          $ref: '#/definitions/internal_cart.CartItem'
        type: array
      session_id:
        type: string
      ship_ready:
        items:
          $ref: '#/definitions/internal_cart.CartItem'
        type: array
      summary:
        $ref: '#/definitions/internal_cart.CartSummaryDTO'
    type: object
  internal_cart.CartSummaryDTO:
    properties:
      currency:
        type: string
      total_balance_due:
        type: string
      total_charged_now:
        type: string
      total_deposit:
        type: string
      total_pre_order:
        type: string
      total_ship_ready:
        type: string
    type: object
  internal_cart.GuestSessionResponse:
    properties:
      expires_at:
        type: string
      session_id:
        type: string
    type: object
  internal_cart.MergeCartRequest:
    properties:
      guest_session_id:
        type: string
    required:
    - guest_session_id
    type: object
  internal_cart.UpdateCartItemRequest:
    properties:
      quantity:
        minimum: 0
        type: integer
    type: object
  internal_checkout.CalculateShippingRequest:
    properties:
      address_id:
        type: integer
      country:
        type: string
      province:
        type: string
      shipping_method:
        type: string
      zip:
        type: string
    required:
    - shipping_method
    type: object
  internal_checkout.CheckoutSummaryRequest:
    properties:
      address_id:
        type: integer
      shipping_method:
        type: string
    required:
    - shipping_method
    type: object
  internal_checkout.CheckoutSummaryResponse:
    properties:
      currency:
        type: string
      due_august:
        properties:
          preorder_balance:
            type: string
          shipping_preorder:
            type: string
          total:
            type: string
        type: object
      due_now:
        properties:
          preorder_deposit:
            type: string
          ship_ready_total:
            type: string
          shipping:
            type: string
          total:
            type: string
        type: object
      pre_order:
        properties:
          balance_subtotal:
            type: string
          deposit_subtotal:
            type: string
          items:
            items:
              $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_cart.CartItem'
            type: array
        type: object
      ship_ready:
        properties:
          items:
            items:
              $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_cart.CartItem'
            type: array
          subtotal:
            type: string
        type: object
      shipping:
        properties:
          cost:
            type: string
          estimated_arrival:
            type: string
          method:
            type: string
        type: object
    type: object
  internal_checkout.ShippingMethod:
    properties:
      cost:
        type: string
      estimated_arrival:
        type: string
      id:
        type: string
      label:
        type: string
    type: object
  internal_checkout.ShippingMethodsResponse:
    properties:
      currency:
        type: string
      methods:
        items:
          $ref: '#/definitions/internal_checkout.ShippingMethod'
        type: array
    type: object
  internal_order.CreateOrderRequest:
    properties:
      guest_info:
        $ref: '#/definitions/internal_order.GuestInfo'
      shipping_method:
        type: string
    required:
    - shipping_method
    type: object
  internal_order.GuestInfo:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    required:
    - email
    - first_name
    - last_name
    type: object
  internal_order.OrderItemDetail:
    properties:
      dp_amount:
        type: string
      final_amount:
        type: string
      id:
        type: string
      item_status:
        type: string
      quantity:
        type: integer
      type:
        type: string
      variant_id:
        type: string
    type: object
  internal_order.OrderResponse:
    properties:
      aggregate_status:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/internal_order.OrderItemDetail'
        type: array
      shopify_checkout_url:
        type: string
      shopify_draft_invoice_url:
        type: string
      total_price:
        type: string
    type: object
  internal_product.FulfillmentType:
    enum:
    - ship_ready
    - pre_order
    type: string
    x-enum-varnames:
    - FulfillmentTypeShipReady
    - FulfillmentTypePreOrder
  internal_product.VariantDTO:
    properties:
      fulfillment_type:
        $ref: '#/definitions/internal_product.FulfillmentType'
      id:
        type: string
      image_src:
        type: string
      retail_price:
        type: string
      title:
        type: string
      ws_price:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: Momiji Home Backend API with Shopify orchestration
  termsOfService: http://swagger.io/terms/
  title: Momiji Home API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login user and return tokens
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      description: Logout user by clearing refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      summary: Logout user
      tags:
      - Auth
  /auth/me:
    get:
      description: Get current user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a refresh token
      parameters:
      - description: Refresh Request (if not in cookie)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.TokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
      summary: Refresh token
      tags:
      - Auth
  /cart:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Clear all cart items
      tags:
      - Cart
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_cart.CartResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get Cart
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      parameters:
      - description: Add Item Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_cart.CartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /cart/items/{id}:
    delete:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      consumes:
      - application/json
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Quantity Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_cart.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Update item quantity
      tags:
      - Cart
  /cart/merge:
    post:
      consumes:
      - application/json
      parameters:
      - description: Merge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_cart.MergeCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Merge guest cart into user cart
      tags:
      - Cart
  /cart/session:
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_cart.GuestSessionResponse'
              type: object
      summary: Create Guest Cart Session
      tags:
      - Cart
  /cart/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_cart.CartSummaryDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get Cart Summary
      tags:
      - Cart
  /checkout/summary:
    post:
      consumes:
      - application/json
      parameters:
      - description: Checkout Summary Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_checkout.CheckoutSummaryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_checkout.CheckoutSummaryResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get checkout summary
      tags:
      - Checkout
  /orders:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_order.OrderResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List customer orders
      tags:
      - Order
    post:
      consumes:
      - application/json
      parameters:
      - description: Create Order Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_order.OrderResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create an order from cart
      tags:
      - Order
  /products:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_product.VariantDTO'
                  type: array
              type: object
      summary: List products
      tags:
      - Product
  /products/sync:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Sync products from Shopify
      tags:
      - Product
  /shipping/calculate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Calculate Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_checkout.CalculateShippingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Calculate shipping cost
      tags:
      - Shipping
  /shipping/methods:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_checkout.ShippingMethodsResponse'
              type: object
      security:
      - BearerAuth: []
      summary: List shipping methods
      tags:
      - Shipping
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
