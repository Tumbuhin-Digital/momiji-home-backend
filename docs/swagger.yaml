      city:
        type: string
      country:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
      province:
        type: string
      zip:
        type: string
    type: object
  order.CancelOrderRequest:
    properties:
      fulfillment_type:
