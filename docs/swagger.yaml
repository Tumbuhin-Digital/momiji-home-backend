  /cart/merge:
    post:
      consumes:
      - application/json
      parameters:
      - description: Merge Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_cart.MergeCartRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      security:
      - BearerAuth: []
      summary: Merge guest cart into user cart
      tags:
      - Cart
  /cart/session:
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_cart.GuestSessionResponse'
              type: object
      summary: Create Guest Cart Session
      tags:
      - Cart
  /cart/summary:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_cart.CartSummaryDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get Cart Summary
      tags:
      - Cart
  /checkout/summary:
    post:
      consumes:
      - application/json
      parameters:
      - description: Checkout Summary Request
        in: body
        name: request
        required: true
