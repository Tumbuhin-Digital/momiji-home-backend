basePath: /api/v1
definitions:
  github_com_tumbuhindigi-sys_momiji-home-backend_internal_cart.CartItem:
    properties:
      balance_due:
        type: string
      deposit_amount:
        type: string
      id:
        type: string
      image_src:
        type: string
      quantity:
        type: integer
      subtotal:
        type: string
      title:
        type: string
      unit_price:
        type: string
      variant_id:
        type: string
    type: object
  github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
      message:
        type: string
      status:
        description: '"success" or "error"'
        type: string
      timestamp:
        type: string
    type: object
  github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock:
    properties:
      code:
        type: string
      details: {}
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.TokenResponse:
    properties:
      expires_in:
        description: seconds
        type: integer
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    type: object
  internal_auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
      shopify_customer_id:
        type: string
    type: object
  internal_cart.CartItem:
    properties:
      balance_due:
        type: string
      deposit_amount:
        type: string
      id:
        type: string
      image_src:
        type: string
      quantity:
        type: integer
      subtotal:
        type: string
      title:
        type: string
      unit_price:
        type: string
      variant_id:
        type: string
    type: object
  internal_cart.CartItemRequest:
    properties:
      fulfillment_type:
        enum:
        - ship_ready
        - pre_order
        type: string
      quantity:
        minimum: 1
        type: integer
      variant_id:
        type: string
    required:
    - fulfillment_type
    - quantity
    - variant_id
    type: object
  internal_cart.CartResponse:
    properties:
      pre_order:
        items:
          $ref: '#/definitions/internal_cart.CartItem'
        type: array
      session_id:
        type: string
      ship_ready:
        items:
          $ref: '#/definitions/internal_cart.CartItem'
        type: array
      summary:
        $ref: '#/definitions/internal_cart.CartSummaryDTO'
    type: object
  internal_cart.CartSummaryDTO:
    properties:
      currency:
        type: string
      total_balance_due:
        type: string
      total_charged_now:
        type: string
      total_deposit:
        type: string
      total_pre_order:
        type: string
      total_ship_ready:
        type: string
    type: object
  internal_cart.GuestSessionResponse:
    properties:
      expires_at:
        type: string
      session_id:
        type: string
    type: object
  internal_cart.MergeCartRequest:
    properties:
      guest_session_id:
        type: string
    required:
    - guest_session_id
    type: object
  internal_cart.UpdateCartItemRequest:
    properties:
      quantity:
        minimum: 0
        type: integer
    type: object
  internal_checkout.CalculateShippingRequest:
    properties:
      address_id:
        type: integer
      country:
        type: string
      province:
        type: string
      shipping_method:
        type: string
      zip:
        type: string
    required:
    - shipping_method
    type: object
  internal_checkout.CheckoutSummaryRequest:
    properties:
      address_id:
        type: integer
      shipping_method:
        type: string
    required:
    - shipping_method
    type: object
  internal_checkout.CheckoutSummaryResponse:
    properties:
      currency:
        type: string
      due_august:
        properties:
          preorder_balance:
            type: string
          shipping_preorder:
            type: string
          total:
            type: string
        type: object
      due_now:
        properties:
          preorder_deposit:
            type: string
          ship_ready_total:
            type: string
          shipping:
            type: string
          total:
            type: string
        type: object
      pre_order:
        properties:
          balance_subtotal:
            type: string
          deposit_subtotal:
            type: string
          items:
            items:
              $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_cart.CartItem'
            type: array
        type: object
      ship_ready:
        properties:
          items:
            items:
              $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_cart.CartItem'
            type: array
          subtotal:
            type: string
        type: object
      shipping:
        properties:
          cost:
            type: string
          estimated_arrival:
            type: string
          method:
            type: string
        type: object
    type: object
  internal_checkout.ShippingMethod:
    properties:
      cost:
        type: string
      estimated_arrival:
        type: string
      id:
        type: string
      label:
        type: string
    type: object
  internal_checkout.ShippingMethodsResponse:
    properties:
      currency:
        type: string
      methods:
        items:
          $ref: '#/definitions/internal_checkout.ShippingMethod'
        type: array
    type: object
  internal_customer.AddressResponse:
    properties:
      address1:
        type: string
      city:
        type: string
      country:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      province:
        type: string
      zip:
        type: string
    type: object
  internal_customer.CustomerDetailResponse:
    properties:
      addresses:
        items:
          $ref: '#/definitions/internal_customer.AddressResponse'
        type: array
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      orders_count:
        type: integer
      phone:
        type: string
    type: object
  internal_customer.CustomerOrderResponse:
    properties:
      aggregate_status:
        type: string
      created_at:
        type: string
      id:
        type: string
      total_price:
        type: number
    type: object
  internal_customer.CustomerResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      orders_count:
        type: integer
      phone:
        type: string
    type: object
  internal_order.AcceptOrderRequest:
    properties:
      fulfillment_type:
        type: string
    required:
    - fulfillment_type
    type: object
  internal_order.CancelOrderRequest:
    properties:
      fulfillment_type:
        type: string
      reason:
        type: string
    required:
    - fulfillment_type
    - reason
    type: object
  internal_order.CreateOrderRequest:
    properties:
      guest_info:
        $ref: '#/definitions/internal_order.GuestInfo'
      shipping_method:
        type: string
    required:
    - shipping_method
    type: object
  internal_order.GuestInfo:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    required:
    - email
    - first_name
    - last_name
    type: object
  internal_order.LineItemsGroup:
    properties:
      pre_order:
        items:
          $ref: '#/definitions/internal_order.OrderItemDetail'
        type: array
      ship_ready:
        items:
          $ref: '#/definitions/internal_order.OrderItemDetail'
        type: array
    type: object
  internal_order.OrderItemDetail:
    properties:
      dp_amount:
        type: string
      final_amount:
        type: string
      fulfillment_step:
        type: integer
      id:
        type: string
      item_status:
        type: string
      items_received:
        type: integer
      quantity:
        type: integer
      type:
        type: string
      variant_id:
        type: string
    type: object
  internal_order.OrderResponse:
    properties:
      aggregate_status:
        type: string
      id:
        type: string
      line_items:
        $ref: '#/definitions/internal_order.LineItemsGroup'
      shopify_checkout_url:
        type: string
      shopify_draft_invoice_url:
        type: string
      total_price:
        type: string
    type: object
  internal_order.UpdateReceivedRequest:
    properties:
      items_received:
        minimum: 0
        type: integer
    required:
    - items_received
    type: object
  internal_order.UpdateStepRequest:
    properties:
      fulfillment_step:
        maximum: 4
        minimum: 1
        type: integer
    required:
    - fulfillment_step
    type: object
  internal_preorder.SettlementResponse:
    properties:
      amount:
        type: number
      created_at:
        type: string
      id:
        type: string
      invoiced_at:
        type: string
      order_id:
        type: string
      paid_at:
        type: string
      status:
        type: string
    type: object
  internal_product.FulfillmentType:
    enum:
    - ship_ready
    - pre_order
    type: string
    x-enum-varnames:
    - FulfillmentTypeShipReady
    - FulfillmentTypePreOrder
  internal_product.ProductDetailDTO:
    properties:
      description:
        type: string
      id:
        type: string
      shopify_id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  internal_product.VariantDTO:
    properties:
      fulfillment_type:
        $ref: '#/definitions/internal_product.FulfillmentType'
      id:
        type: string
      image_src:
        type: string
      retail_price:
        type: string
      title:
        type: string
      ws_price:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: Momiji Home Backend API with Shopify orchestration
  termsOfService: http://swagger.io/terms/
  title: Momiji Home API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login user and return tokens
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      description: Logout user by clearing refresh token cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
      summary: Logout user
      tags:
      - Auth
  /auth/me:
    get:
      description: Get current user profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Get a new access token using a refresh token (no body required)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.TokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
      summary: Refresh token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user and return tokens
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
        "409":
          description: Conflict
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                error:
                  $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.ErrorBlock'
              type: object
      summary: Register a new user
      tags:
      - Auth
  /cart:
