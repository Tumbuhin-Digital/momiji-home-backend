          $ref: '#/definitions/webhook.ShopifyOrderLineItem'
        type: array
      note_attributes:
        items:
          $ref: '#/definitions/webhook.ShopifyProperty'
        type: array
      order_number:
        type: integer
      shipping_address:
        $ref: '#/definitions/webhook.ShopifyAddress'
      total_price:
