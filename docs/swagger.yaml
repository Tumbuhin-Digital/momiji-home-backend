      - description: Create Order Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_order.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_order.OrderResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create an order from cart
      tags:
      - Order
  /orders/{id}:
    get:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_tumbuhindigi-sys_momiji-home-backend_internal_shared_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/internal_order.OrderResponse'
              type: object
      security:
      - BearerAuth: []
